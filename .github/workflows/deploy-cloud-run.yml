name: Deploy Backend To Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: deans-filing-system
  REGION: asia-northeast1
  WIF_PROVIDER: projects/463695708385/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT: github-actions-deployer@deans-filing-system.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: deans-server-runtime@deans-filing-system.iam.gserviceaccount.com
  INSTANCE_CONNECTION_NAME: deans-filing-system:asia-northeast1:deans-server-postgres
  SERVICE_NAME: deans-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe cloud-run \
            --project "$PROJECT_ID" \
            --location "$REGION" >/dev/null 2>&1; then
            gcloud artifacts repositories create cloud-run \
              --project "$PROJECT_ID" \
              --location "$REGION" \
              --repository-format docker
          fi

      - name: Build backend image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud builds submit --project "$PROJECT_ID" --tag "$IMAGE"

      - name: Deploy backend service
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "$INSTANCE_CONNECTION_NAME" \
            --allow-unauthenticated \
            --timeout 3600 \
            --set-env-vars "NODE_ENV=production,ESP32_WS_PATH=/api/esp32/ws" \
            --set-secrets "DATABASE_URL=deans-server-database-url:latest,JWT_SECRET=deans-server-jwt-secret:latest" \
            --quiet
